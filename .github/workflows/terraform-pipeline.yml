name: Terraform Main Pipeline

on:
  workflow_call:
    inputs:
      workingDirectory:
        required: true
        type: string
      resourceGroupName:
        required: true
        type: string
      storageAccountName:
        required: true
        type: string
      containerName:
        required: true
        type: string
      backendKey:
        required: true
        type: string
      environment:
        required: false
        type: string
      pool:
        required: false
        type: string
        default: 'ubuntu-latest'
      terraformVersion:
        required: false
        type: string
        default: '1.11.0'
      runCheckov:
        required: false
        type: boolean
        default: false
      initOptions:
        required: false
        type: string
        default: '-reconfigure -input=false'
      planOptions:
        required: false
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Terraform Plan
    runs-on: ${{ inputs.pool }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup
        uses: varunsoam/pipeline-template/.github/actions/terraform-setup@main
        with:
          terraform_version: ${{ inputs.terraformVersion }}

      - name: Init
        uses: varunsoam/pipeline-template/.github/actions/terraform-init@main
        with:
          working_directory: ${{ inputs.workingDirectory }}
          resource_group_name: ${{ inputs.resourceGroupName }}
          storage_account_name: ${{ inputs.storageAccountName }}
          container_name: ${{ inputs.containerName }}
          key: ${{ inputs.backendKey }}
          init_options: ${{ inputs.initOptions }}

      - name: Plan
        uses: varunsoam/pipeline-template/.github/actions/terraform-plan@main
        with:
          working_directory: ${{ inputs.workingDirectory }}
          plan_options: ${{ inputs.planOptions }}

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ inputs.workingDirectory }}/tfplan

  scan:
    name: Checkov Scan
    needs: build
    if: inputs.runCheckov == true
    runs-on: ${{ inputs.pool }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ inputs.workingDirectory }}
          framework: terraform
          skip_check: CKV_AZURE_183,CKV2_AZURE_31

  apply:
    name: Terraform Apply
    needs: [build, scan]
    if: |
      always() && 
      needs.build.result == 'success' && 
      (needs.scan.result == 'success' || needs.scan.result == 'skipped') &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.pool }}
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup
        uses: varunsoam/pipeline-template/.github/actions/terraform-setup@main
        with:
          terraform_version: ${{ inputs.terraformVersion }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ inputs.workingDirectory }}

      - name: Init
        uses: varunsoam/pipeline-template/.github/actions/terraform-init@main
        with:
          working_directory: ${{ inputs.workingDirectory }}
          resource_group_name: ${{ inputs.resourceGroupName }}
          storage_account_name: ${{ inputs.storageAccountName }}
          container_name: ${{ inputs.containerName }}
          key: ${{ inputs.backendKey }}
          init_options: ${{ inputs.initOptions }}

      - name: Apply
        uses: varunsoam/pipeline-template/.github/actions/terraform-apply@main
        with:
          working_directory: ${{ inputs.workingDirectory }}
